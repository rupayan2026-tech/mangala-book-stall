<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | মঙ্গলা বুক স্টল</title><style>body{font-family:Arial,sans-serif;background:#fffaf0;margin:0;color:#132238}header{background:#072c63;color:#fff;padding:20px;text-align:center;font-size:24px;font-weight:bold}.wrap{max-width:900px;margin:30px auto;padding:20px;background:#fff;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:bold}input,select{display:block;width:100%;padding:11px;margin-top:5px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;font:inherit}button{margin-top:18px;padding:12px 22px;border:0;border-radius:8px;background:#e52521;color:#fff;font-weight:bold;cursor:pointer}.row{padding:12px 0;border-bottom:1px solid #eee}.del{float:right;background:#777;margin:0;padding:6px 10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header>📚 মঙ্গলা বুক স্টল — Admin Panel</header><main class="wrap"><h2>বইয়ের data যোগ করুন</h2><form id="form"><div class="grid"><label>Class<select name="class" required><option value="">নির্বাচন করুন</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label><label>Company<select name="company" required><option value="">নির্বাচন করুন</option><option>প্রান্তিক</option><option>সাঁতরা সহায়িকা</option><option>রায় ও মার্টিন</option><option>ছায়া প্রকাশনী</option><option>ছাত্রবন্ধু</option></select></label><label>Subject<select name="subject" required><option value="">নির্বাচন করুন</option><option>বিজ্ঞান</option><option>পদার্থবিদ্যা (Physics)</option> <option>রসায়নবিদ্যা (Chemistry)</option> <option>গণিত (Mathematics)</option> <option>জীববিদ্যা (Biological Science / Biology)</option> <option>কম্পিউটার সায়েন্স (Computer Science)</option> <option>কম্পিউটার অ্যাপ্লিকেশন (Computer Application)</option> <option>ভূগোল (Geography)</option> <option>পরিসংখ্যান (Statistics)</option> <option>পুষ্টিবিজ্ঞান (Nutrition)</option> <option>বাংলা (Bengali)</option> <option>ইংরেজি (English)</option> <option>ইতিহাস (History)</option> <option>রাষ্ট্রবিজ্ঞান (Political Science)</option> <option>দর্শন (Philosophy)</option> <option>শিক্ষা বিজ্ঞান (Education)</option> <option>অর্থনীতি (Economics)</option> <option>সংস্কৃত (Sanskrit)</option> <option>সমাজবিদ্যা (Sociology)</option> <option>মনোবিজ্ঞান (Psychology)</option> <option>সাংবাদিকতা ও গণমাধ্যম (Journalism & Mass Communication)</option> <option>পরিবেশবিদ্যা (Environmental Studies)</option> <option>সঙ্গীত (Music)</option> <option>চারুকলা (Visual Arts)</option> <option>হিসাবশাস্ত্র (Accountancy)</option> <option>ব্যবসায় শিক্ষা (Business Studies)</option> <option>ব্যয় ও কর নির্ধারণ (Costing & Taxation)</option> <option>বাণিজ্যিক আইন ও অডিটের প্রাথমিক বিষয় (Commercial Law & Preliminaries of Auditing)</option></select></label><label>Type<select name="type" required><option value="">নির্বাচন করুন</option><option>Text Book</option><option>সহায়িকা</option></select></label><label>Printing দাম<input name="printing_price" type="number" min="0" step="0.01" required></label><label>ছাড় (%)<input name="discount_percent" type="number" min="0" max="100" step="0.01" required></label></div><div id="calc" style="margin-top:14px;color:#072c63;font-weight:bold">Printing দাম ও discount লিখলে ছাড়ের পর দাম এখানে দেখাবে।</div><button>Save book</button></form><p id="msg"></p><h2>বর্তমান বই</h2><div id="list">লোড হচ্ছে...</div></main><script>const adminPassword=prompt('Admin password দিন')||'';const originalFetch=window.fetch;window.fetch=(url,options={})=>{if(String(url).startsWith('/api/books')&&options.method&&options.method!=='GET'){options.headers={...(options.headers||{}),'X-Admin-Password':adminPassword}}return originalFetch(url,options)};</script><script>const form=document.getElementById('form'),msg=document.getElementById('msg'),list=document.getElementById('list'),calc=document.getElementById('calc');function calculate(){const p=Number(form.printing_price.value),d=Number(form.discount_percent.value);calc.textContent=p&&d>=0?'ছাড়ের পর দাম: ₹'+(p-p*d/100).toFixed(2):'Printing দাম ও discount লিখলে ছাড়ের পর দাম এখানে দেখাবে.'}form.printing_price.addEventListener('input',calculate);form.discount_percent.addEventListener('input',calculate);async function load(){const r=await fetch('/api/books');const a=await r.json();list.innerHTML=a.length?a.map(b=>`<div class="row"><b>ক্লাস ${b.class} — ${b.company}</b><br>${b.subject} • ${b.type} • ₹${b.printing_price} • ${b.discount_percent}% <button class="del" onclick="del(${b.id})">Delete</button></div>`).join(''):'কোনো বই যোগ করা হয়নি।'}form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/books',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json();msg.textContent=d.error||'সফলভাবে save হয়েছে';if(r.ok){form.reset();load()}};async function del(id){if(confirm('এই বইটি delete করবেন?')){await fetch('/api/books?id='+id,{method:'DELETE'});load()}}load();</script></body></html>
